[project]
name = "cm"
version = "0.1.0"
description = "AI-powered git commit message generator with pluggable providers"
readme = "README.md"
authors = [
    { name = "Sheldon McGrandle", email = "developer@8cylinder.com" }
]
requires-python = ">=3.13"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
dependencies = [
    "boto3>=1.43.44",
    "click>=8.3.0",
    "platformdirs>=4.0.0",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/8cylinder/commit"
Repository = "https://github.com/8cylinder/commit"
Issues = "https://github.com/8cylinder/commit/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[project.scripts]
cm = "cm.cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 80

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "N",
    "PTH",
    "RUF",
    "RET",
    "ARG",
    "TID",
    "ANN",
    "PGH003",
    "PYI",
]
# boto3 is untyped, so the Bedrock session factory is necessarily dynamic.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# The prompt template intentionally contains long prose lines.
"src/cm/prompt.py" = ["E501"]
# Tests use loosely typed fakes and plain asserts.
"tests/**" = ["ANN", "ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=cm --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["cm"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ty.rules]
all = "error"
